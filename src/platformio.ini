; ExpressLRS PlatformIO Project Configuration File

[platformio]
extra_configs =
	# keep common first
	targets/common.ini
	targets/esp32-tx.ini
	targets/esp32s3-tx.ini
	targets/esp32c3-tx.ini
	targets/esp8285-tx.ini
	targets/esp32-rx.ini
	targets/esp32s3-rx.ini
	targets/esp32c3-rx.ini
	targets/esp8285-rx.ini

# ------------------------- TARGET ENV DEFINITIONS -----------------

[env:native]
platform = native
framework =
test_ignore = test_embedded, test_br915
lib_ignore = BUTTON, DAC, LQCALC, LBT, SPIEx, PWM, WIFI, TCPSOCKET, SX127xDriver, LR1121Driver, LR2021Driver
build_src_filter = ${common_env_data.build_src_filter} -<ESP32*.*> -<ESP8*.*> -<tx_*.cpp> -<rx_*.cpp> -<common.*> -<config.*>
build_flags =
	-std=c++11
	-Iinclude
	-D PROGMEM=""
	-D UNIT_TEST=1
	-D TARGET_NATIVE

[env:native_br915]
extends = env:native
test_ignore = test_embedded
test_filter = test_br915
build_flags = ${env:native.build_flags} -DRADIO_LR1121=1 -DRegulatory_Domain_BR_915 -Ilib/LR1121Driver

[env:native_br915_sx127x]
extends = env:native_br915
build_flags = ${env:native.build_flags} -DRADIO_SX127X=1 -DRegulatory_Domain_BR_915 -Ilib/SX127xDriver

[env:native_br915_ce]
extends = env:native_br915
build_flags = ${env:native_br915.build_flags} -DRegulatory_Domain_EU_CE_2400
